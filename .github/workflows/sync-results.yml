name: Sync EuroMillions historical results

on:
  schedule:
    - cron: '30 22 * * 2,5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-results
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Update historical dataset
        run: node scripts/update-results.mjs
      - name: Commit updated dataset
        run: |
          if git diff --quiet -- data/results.json; then
            echo "No hi ha canvis a les dades."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/results.json
          git commit -m "Update EuroMillions historical results"
          git push
